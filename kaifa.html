  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 动态背景粒子 */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float 15s infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* 主容器 */
    .container {
      text-align: center;
      z-index: 10;
      padding: 40px;
      max-width: 700px;
    }

    /* 建设图标动画 */
    .construction-icon {
      font-size: 80px;
      margin-bottom: 30px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* 齿轮动画 */
    .gears {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 40px;
    }

    .gear {
      width: 60px;
      height: 60px;
      fill: #e94560;
      animation: rotate 4s linear infinite;
    }

    .gear:nth-child(2) {
      animation-direction: reverse;
      fill: #f39c12;
    }

    .gear:nth-child(3) {
      fill: #3498db;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 标题 */
    h1 {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(90deg, #e94560, #f39c12, #3498db);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient 3s ease infinite;
      margin-bottom: 20px;
    }

    @keyframes gradient {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }

    /* 副标题 */
    .subtitle {
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 300;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    /* 进度条 */
    .progress-container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      padding: 6px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .progress-bar {
      height: 20px;
      background: linear-gradient(90deg, #e94560, #f39c12, #3498db);
      background-size: 200% 100%;
      border-radius: 50px;
      width: 65%;
      animation: progress-animation 2s ease-in-out infinite, gradient 3s ease infinite;
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.4),
        transparent
      );
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes progress-animation {
      0%, 100% { width: 60%; }
      50% { width: 70%; }
    }

    .progress-text {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
      margin-top: 10px;
    }

    /* 特性卡片 */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 50px;
    }

    .feature-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 25px 15px;
      transition: all 0.3s ease;
    }

    .feature-card:hover {
      transform: translateY(-10px);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .feature-icon {
      font-size: 2.5rem;
      margin-bottom: 15px;
    }

    .feature-title {
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
    }

    /* 底部信息 */
    .footer {
      margin-top: 60px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
    }

    .footer a {
      color: #e94560;
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer a:hover {
      color: #f39c12;
    }

    .footer .back-link {
      display: inline-block;
      font-size: 1.2rem;
      padding: 12px 30px;
      background: linear-gradient(90deg, #e94560, #f39c12);
      border-radius: 50px;
      color: #fff;
      font-weight: 500;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }

    .footer .back-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
      color: #fff;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      
      .subtitle {
        font-size: 1rem;
      }
      
      .features {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      
      .gear {
        width: 40px;
        height: 40px;
      }
      
      .construction-icon {
        font-size: 60px;
      }
    }
  </style>
